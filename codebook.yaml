required:
  feature:
    core: "프레이밍·인코딩·정규화·버전 ID·서명 — 엔진 내장 규칙. 외부 의존·네트워크 없음"
    resolve: "IMPORT 의존성 해석 — Resolver 주입(로컬 아카이브·HTTP·메모리), 명시적 단계"
    toulmin: "TOULMIN 코덱 — 판정·실행 그래프 레코드(NODE·LINK·제어·TEXT·SOURCE), 코덱·형식 번호표, 판정값·게이트·SPAN (명세 TOULMIN.md)"
    inspect: "GEUL → 해석된 문서 모델 — 레코드별 스펙 이름·디코드 내용·Edge Id·참조. 재인코딩이 같을 때만 타입 내용, 아니면 원본 레코드 (뷰어·텍스트 표현의 공통 기반)"
    codecspec: "Codec 규격 — DECLARE·FIELD·ENUM·BIND로 쓴 규격 문서를 Codec별 필드 목록으로 모은다 (명세 edge/DECLARE)"
    schema: "형식 검증 — 0층 규칙(프레이밍·구조·Kind), Codec 규격 레이아웃, 격틀·선택 제약"
    delta: "버전 diff와 LOCAL ID 이어받기 — 직전 스냅숏에서 같은 서술에 같은 번호(auto increment), diff 생성·적용 (명세 meta/lineage/DELTA-BASE·DELTA-REMOVE·NEXT-LOCAL-ID)"
    notation: "텍스트 표기 — 레코드 한 줄 ↔ GEUL 레코드(geul CLI show·add·meta). 짧은 형식이 없으면 날 WORD로 써서 왕복 보장"
    cli: "geul 명령줄 도구 — cobra 명령 정의, 인자 해석과 출력만(로직은 pkg)"
    page: "뷰어 페이지 — inspect.Document → 페이지 모델(HEAD·BODY 행, 필드, 참조·역참조, SOURCE 구간, 그래프) → HTML"
    server: "뷰어 HTTP 서버(geul serve) — 요청마다 .geul을 읽어 페이지(브라우저)나 바이트(Accept application/vnd.geul)·목록으로 응답"
    build: "정적 굽기(geul build) — 트리를 원본·뷰어 페이지·목록·스크립트 파일로 써서 웹 호스트(S3+CloudFront)에 올린다"
    pack: "pack 저장 포맷 — 아카이브(경로 → 바이트)를 내용 해시 이름의 불변 객체(매니페스트·색인·데이터 pack)로 담고 로컬 pread·HTTP Range로 읽고 세대로 쓴다 (geul-dev files/pack/README.md)"
    config: "geul CLI 설정 — 플래그·환경변수(GEUL…)·설정 파일·데이터 폴더 탐색의 우선순위 해석"
  type:
    model: "data type definition"
    decoder: "binary → structure"
    encoder: "structure → binary"
    rule: "individual validation rule"
    resolver: "document location/fetch implementation"
    helper: "internal utility function"
    command: "cobra 명령 엔트리포인트"
    handler: "HTTP 핸들러"
    builder: "inspect 결과 → 페이지 모델"
    renderer: "페이지 모델 → HTML·JSON"
    writer: "pack 세대 쓰기 — 레코드·색인 블록·매니페스트 객체와 latest.txt를 만든다"

optional:
  level:
    error: "error-path handling"
